# Fotos de facturas (US-B6): el agente recibe la lectura estructurada y arma el gasto sin
# inventar lo que no se leyó. Casos de la prueba real de S2 día 4.
- name: factura completa en dólares
  receipt: { total: "45.90", currency: USD, date: "", vendor: "Ferretería El Tornillo", line_items_count: 3 }
  expect:
    tool: draft_expense
    args: { amount: "45.90", currency: USD, when: "" }

- name: factura sin moneda legible deja la moneda en unknown
  receipt: { total: "1250", currency: unknown, date: "", vendor: "Hielos del Centro", line_items_count: 1 }
  expect:
    tool: draft_expense
    args: { amount: "1250", currency: unknown }

- name: factura con fecha de ayer
  receipt: { total: "18", currency: USD, date: "ayer", vendor: "Bodegón La 20", line_items_count: 2 }
  expect:
    tool: draft_expense
    args: { amount: "18", currency: USD, when: ayer }

# Reporte de ventas en PDF (03/10, prueba de Javier): "Detalles de ventas" de su propio negocio se
# registraba como gasto. El lector marca document_type sales y el agente va a la venta del día.
- name: reporte de ventas del propio negocio es venta del día
  receipt: { total: "115.80", currency: USD, date: "2026-09-30", vendor: "Jp Car Wash", line_items_count: 4, document_type: sales }
  expect:
    tool: draft_income_day_total
    tool_not: draft_expense

- name: la leyenda "es una venta" manda sobre una lectura de gasto
  receipt: { total: "60", currency: USD, date: "", vendor: "Cliente Pedro", line_items_count: 1, document_type: unknown }
  caption: "esto es una venta que me pagaron"
  expect:
    tool_not: draft_expense

# Factura ilegible (03/10, prueba de Javier): el bot pide en un solo mensaje gasto o venta, monto y
# en qué fue; la respuesta siguiente va directo al borrador, sin más preguntas.
- name: respuesta completa a una factura ilegible
  input: "gasto 12.955 Bs en comida"
  after_unclear_receipt: { total: "12955.10", currency: VES }
  history:
    - { role: in, body: "[foto de factura que no se pudo leer bien] posible total 12955.10 VES" }
    - { role: out, body: "🧾 No pude leer bien la factura. Escríbeme en un solo mensaje: si fue gasto o venta, el monto con la moneda y en qué fue." }
  expect:
    tool: draft_expense
    args: { currency: VES }

- name: solo el monto tras una factura ilegible es un gasto con descripción Factura
  input: "12956 bs"
  after_unclear_receipt: { total: "12955.10", currency: VES }
  history:
    - { role: in, body: "[foto de factura que no se pudo leer bien] posible total 12955.10 VES" }
    - { role: out, body: "🧾 No pude leer bien la factura. Escríbeme en un solo mensaje: si fue gasto o venta, el monto con la moneda y en qué fue." }
  expect:
    tool: draft_expense
    tool_not: ask_clarification

- name: venta tras una factura ilegible no queda como gasto
  input: "fue una venta de 300$"
  after_unclear_receipt: { total: "300", currency: USD }
  history:
    - { role: in, body: "[foto de factura que no se pudo leer bien] posible total 300 USD" }
    - { role: out, body: "🧾 No pude leer bien la factura. Escríbeme en un solo mensaje: si fue gasto o venta, el monto con la moneda y en qué fue." }
  expect:
    tool_not: draft_expense
    pending_after: 1

# Pago móvil desde foto (03/10, pedido de Javier): los datos se mandan para copiar y abajo queda el
# gasto listo para Guardar cuando pague.
- name: datos de pago móvil con monto quedan como gasto en bolívares
  receipt:
    total: "1250.00"
    currency: VES
    document_type: pago_movil
    payee: { bank: "Banco Venezuela", phone: "04123020256", id_number: "V-25871244", holder: "Javier Ortiz" }
  expect:
    tool: draft_expense
    args: { amount: "1250.00", currency: VES, description: "Pago móvil a Javier Ortiz" }

- name: datos de pago móvil con leyenda usan la leyenda
  receipt:
    total: "800"
    currency: VES
    document_type: pago_movil
    payee: { bank: "Banesco", phone: "04141234567", id_number: "V-12345678", holder: "Gas Oriente" }
  caption: "el gas"
  expect:
    tool: draft_expense
    args: { amount: "800", currency: VES }

- name: monto tras datos de pago móvil sin monto
  input: "1250"
  after_unclear_receipt: { vendor: "Pago móvil a Javier Ortiz", currency: VES, documentType: expense, source: pago_movil }
  history:
    - { role: in, body: "[foto de datos de pago móvil] Pago móvil a Javier Ortiz · sin monto" }
    - { role: out, body: "💸 ¿Es un gasto? Escríbeme el monto y en qué es y te lo dejo listo para guardar." }
  expect:
    tool: draft_expense
    args: { currency: VES }


# Reenvío con texto aparte (03/10, prueba de Javier): la foto llegó primero y quedó en borrador;
# el texto sin monto que sigue es su descripción, no un gasto nuevo ni una pregunta.
- name: texto después de la foto describe su borrador
  input: "Registrar compra de cepillos y pala"
  after_media: true
  pending:
    - { amount: "12960", currency: VES, description: "Factura", with_photo: true }
  expect:
    tool: draft_expense
    args: { corrects_draft: true, amount: "12960", currency: VES }
    pending_after: 1

- name: una pregunta después de la foto no toca el borrador
  input: "cómo va el mes"
  after_media: true
  pending:
    - { amount: "12960", currency: VES, description: "Factura", with_photo: true }
  expect:
    tool: get_summary

- name: leyenda llegada aparte se usa como descripción de la factura
  receipt: { total: "12960.00", currency: VES, date: "2026-10-03", vendor: "", line_items_count: 0 }
  caption: "Registrar compra de cepillos y pala"
  expect:
    tool: draft_expense
    args: { amount: "12960.00", currency: VES }

# Factura leída con una pregunta (03/10, prueba de Javier: la fecha salió vieja): la respuesta
# registra con lo leído, sin volver a pedir el monto.
- name: respuesta a la pregunta de la fecha de una factura
  input: "El gasto es del día de hoy"
  after_unclear_receipt: { total: "8593.15", currency: VES, vendor: "Alimentos VDV, C.A.", documentType: expense, source: receipt_question }
  history:
    - { role: in, body: "[foto de factura] Alimentos VDV, C.A. · 8593.15 VES · 2026-03-10" }
    - { role: out, body: "¿El gasto fue el 2026-03-10? Es de hace más de un mes. Si es así, escríbelo con la fecha completa (por ejemplo 2026-08-15)." }
  expect:
    tool: draft_expense
    args: { amount: "8593.15", currency: VES }
