# Corregir y borrar el último movimiento guardado (US-B8) y tasa manual (ADR-013).
# "bórralo" se resuelve sin LLM; aquí van las variantes en lenguaje libre.
- name: corregir el monto
  input: "no, eran 25"
  expect:
    tool: amend_last_movement
    args: { amount: "25", currency: keep, category_name: "", when: "" }

- name: corregir la categoría
  input: "eso es mantenimiento"
  expect:
    tool: amend_last_movement
    args: { category_name: Mantenimiento de equipos, amount: "" }

- name: corregir la fecha
  input: "ese gasto fue ayer"
  expect:
    tool: amend_last_movement
    args: { when: ayer, amount: "" }

- name: tasa manual
  input: "ponlo a tasa 850"
  expect:
    tool: amend_last_movement
    args: { rate: "850", amount: "" }

- name: borrar con otras palabras
  input: "quita ese último, me equivoqué"
  expect:
    tool: delete_last_movement

- name: corregir la moneda
  input: "era en bolívares"
  expect:
    tool: amend_last_movement
    args: { currency: VES, amount: "" }

- name: borrar con lo último
  input: "borra lo último que anoté"
  expect:
    tool: delete_last_movement

# Borrar varios (02/10, piloto): "eso no lo hago por chat" al querer borrar varios gastos.
- name: bórralos tras guardar varios juntos
  input: "bórralos"
  history:
    - { role: in, body: "gasté 7$ en arepa y 7,5$ en pádel" }
    - { role: out, body: "✅ Guardados 2 gastos. Gastos de hoy: *$14,50* (2 registros)." }
  expect:
    tool: delete_last_movement
    args: { scope: last_batch }

- name: elimina esos gastos (frase del piloto)
  input: "quiero eliminar esos gastos que registré por equivocación"
  history:
    - { role: in, body: "gasté 7$ en arepa y 7,5$ en pádel" }
    - { role: out, body: "✅ Guardados 2 gastos. Gastos de hoy: *$14,50* (2 registros)." }
  expect:
    tool: delete_last_movement
    tool_not: reject_out_of_scope

- name: borrar los N últimos
  input: "borra los 3 últimos"
  expect:
    tool: delete_last_movement
    args: { scope: last_n, count: 3 }

- name: borrar uno por nombre
  input: "borra el de la arepa"
  expect:
    tool: delete_last_movement
    args: { scope: matching }

- name: eliminar los cuatro gastos (mensaje real rechazado el 02/10)
  input: "Puedes eliminar los cuatro gastos que registramos ya los había registrado disculpa"
  expect:
    tool: delete_last_movement
    args: { scope: last_n, count: 4 }
