# Cierre y consultas (US-D1, D2, D3). "cierre" solo se resuelve sin LLM; aquí van las variantes.
- name: cómo fue hoy
  input: "cómo fue hoy?"
  expect:
    tool: get_summary
    args: { period: today, category_name: "" }

- name: cómo va el mes
  input: "cómo va el mes"
  expect:
    tool: get_summary
    args: { period: this_month, category_name: "" }

- name: cuánto llevo esta semana
  input: "cuánto llevo esta semana"
  expect:
    tool: get_summary
    args: { period: this_week }

- name: gasto por categoría en el mes
  input: "cuánto gasté en insumos este mes"
  expect:
    tool: get_summary
    args: { period: this_month, category_name: Insumos de lavado }

- name: rango de fechas del mes
  input: "del 1 al 15 cuánto vendí"
  expect:
    tool: get_summary
    args: { period: custom }

- name: empleado que pide el cierre no lo ve
  input: "cómo fue hoy?"
  role: employee
  expect:
    reply_contains: ["dueño"]
