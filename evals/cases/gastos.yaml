# Registro de gastos por texto. Es el caso número uno del producto (Fase 4).
- name: dólares con símbolo y categoría clara
  input: "gasté 15$ en champú"
  expect:
    tool: draft_expense
    args: { amount: "15", currency: USD, category_name: Insumos de lavado, when: "" }

- name: bolívares en miles con "mil" y fecha relativa
  input: "pagué 450 mil bs de hielo ayer"
  expect:
    tool: draft_expense
    args: { amount: "450000", currency: VES, when: ayer }

- name: coma decimal sin moneda
  input: "15,50 de gasolina"
  expect:
    tool: draft_expense
    args: { amount: "15.50", currency: unknown, category_name: Transporte y gasolina }

- name: punto de miles sin moneda ("se fueron")
  input: "se fueron 1.200 en la luz"
  expect:
    tool: draft_expense
    args: { amount: "1200", currency: unknown, category_name: Agua y electricidad }

- name: medio millón de bolos
  input: "medio millón de bolos en el alquiler"
  expect:
    tool: draft_expense
    args: { amount: "500000", currency: VES, category_name: Alquiler }

- name: antier, dólares en palabra, comida del personal
  input: "antier pagué 30 dólares de almuerzo para los muchachos"
  expect:
    tool: draft_expense
    args: { amount: "30", currency: USD, category_name: Comida del personal, when: antier }

- name: pago móvil no define moneda
  input: "pagué 500 por pago móvil del agua"
  expect:
    tool: draft_expense
    args: { amount: "500", currency: unknown, category_name: Agua y electricidad }

- name: empleado registra un gasto igual
  input: "compré 8$ de cera"
  role: employee
  expect:
    tool: draft_expense
    args: { amount: "8", currency: USD }

- name: anota como verbo de gasto
  input: "anota 12$ de hielo"
  expect:
    tool: draft_expense
    args: { amount: "12", currency: USD }

- name: verdes es dólares
  input: "gasté 15 verdes en gasolina"
  expect:
    tool: draft_expense
    args: { amount: "15", currency: USD, category_name: Transporte y gasolina }

- name: monto con punto de miles y símbolo
  input: "pagué 2.500$ del alquiler"
  expect:
    tool: draft_expense
    args: { amount: "2500", currency: USD, category_name: Alquiler }

- name: moneda al final de la frase
  input: "pagué el agua, 1.500 bs"
  expect:
    tool: draft_expense
    args: { amount: "1500", currency: VES, category_name: Agua y electricidad }

- name: instrucción de registrar cero no deja borrador
  input: "anota un gasto de 0$ en nómina"
  expect:
    no_draft: true

# Bug del 01/10 en el piloto: solo se registraba el primer gasto del mensaje.
- name: dos gastos en un mensaje (mensaje real del piloto)
  input: "Ok vamos a comenzar octubre los gastos de hoy fueron 7$ en una arepa y una malta y 7.5$ en una partida de pádel"
  expect:
    tool: draft_expenses

- name: tres gastos en lista sin moneda repetida
  input: "pagué 20$ de luz, 15$ de agua y 30$ de internet"
  expect:
    tool: draft_expenses

- name: un monto con varias cosas sigue siendo un gasto
  input: "gasté 15$ en champú y cera"
  expect:
    tool: draft_expense
    args: { amount: "15", currency: USD }

- name: autocorrección por texto es un solo gasto con el monto final
  input: "registrar champú. No, no fueron 20, fueron 15 dólares"
  expect:
    tool: draft_expense
    args: { amount: "15", currency: USD }

- name: autocorrección con "digo"
  input: "gasté 20, digo 15, en champú"
  expect:
    tool: draft_expense
    args: { amount: "15" }
