# Calculadora de monedas (03/10, pedido de Javier): convierte sin registrar nada.
- name: bolívares a dólares
  input: "cuánto es 8000 bs en $"
  expect:
    tool: convert_currency
    args: { amount: "8000", from: VES }
    no_draft: true

- name: euros a bolívares
  input: "cuanto es 17€ en bs"
  expect:
    tool: convert_currency
    args: { amount: "17", from: EUR, to: VES }
    no_draft: true

- name: dólares a bolívares
  input: "15$ en bolívares"
  expect:
    tool: convert_currency
    args: { amount: "15", from: USD, to: VES }
    no_draft: true

- name: con tasa propia
  input: "20 dolares a 220 cuanto da"
  expect:
    tool: convert_currency
    args: { amount: "20", from: USD, rate: "220" }

- name: un gasto no es una conversión
  input: "pagué 15$ de luz"
  expect:
    tool: draft_expense
    tool_not: convert_currency

# Sumas y restas (06/10): la novia de Javier sumaba los Bs de los gastos del día para saber
# cuántos USDT cambiar.
- name: suma de varios montos en Bs
  input: "Suma todos estos montos\n\n12030,30\n\n26171,78\n\n26171,78\n\n56706\n\n13085"
  expect:
    tool: sum_amounts
    reply_contains: ["Bs 134.164,86"]
    no_draft: true

- name: suma y resta en dólares
  input: "cuánto es 500$ + 230$ - 80$"
  expect:
    tool: sum_amounts
    reply_contains: ["$650,00"]
    no_draft: true

- name: dividir un total entre varios
  input: "divide 120$ entre 4"
  expect:
    tool: sum_amounts
    reply_contains: ["$30,00"]
    no_draft: true

- name: varios gastos no son una suma
  input: "gasté 5$ en café y 10$ en almuerzo"
  expect:
    tool_not: sum_amounts

# Prueba de Javier (06/10): pidió cada monto en Bs y la suma; el bot convertía uno por mensaje.
- name: varios montos en $ a Bs con su suma
  input: "Necesito que me calcules a tasa $ bcv estos montos y luego me sumes todo para darme un monto final en Bs\n\n13,70$\n15$\n60$\n65$"
  expect:
    tool: sum_amounts
    tool_not: convert_currency
    reply_contains: ["$13,70 = Bs 11.754,60", "Bs 131.874,60"]
    no_draft: true

- name: pide el desglose de los montos anteriores
  history:
    - { role: in, body: "súmame 13,70$ 15$ 60$ 65$" }
    - { role: out, body: "🧮 Suma\n  $13,70\n+ $15,00\n+ $60,00\n+ $65,00\n= $153,70" }
  input: "Claro pero quiero que los desgloses más, quiero todos los montos en bs y la suma final"
  expect:
    tool: sum_amounts
    tool_not: convert_currency
    reply_contains: ["Bs 131.874,60"]
